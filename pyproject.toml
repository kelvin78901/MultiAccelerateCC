[project]
name = "macc"
version = "0.4.2"
description = "MultiAccelerateCC: deterministic task-graph scheduler that drives Claude Code workers in parallel"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[project.scripts]
macc = "macc.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["macc*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
